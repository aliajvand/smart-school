name: Build Flutter Android APK & Automated Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-quality-gate:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt

      - name: Run Backend Pytest Suite (52/52 Tests)
        run: |
          python -m pytest apps/backend -v

  flutter-apk-build:
    name: Build Android APK Binary
    runs-on: ubuntu-latest
    needs: [backend-quality-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Static Analysis
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Mobile Unit & Widget Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build Android Debug APK (Directly Installable on Devices)
        working-directory: apps/mobile
        run: flutter build apk --debug

      - name: Build Android Release APK
        working-directory: apps/mobile
        run: flutter build apk --release --no-shrink
        continue-on-error: true

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-school-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
